version: "3.9"

services:

  # ── FastAPI Backend ────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: idcs_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite DB outside the container filesystem
      - idcs_db:/app/data
    environment:
      # SQLite path inside the volume (matches IDCS_DB_PATH in Dockerfile)
      DATABASE_URL: sqlite:////app/data/idcs.db
      # ── Required secrets — override via .env file or hosting platform ─────────
      IDCS_SECRET_KEY: ${IDCS_SECRET_KEY:-change_this_in_production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # ── Optional: Africa's Talking SMS ───────────────────────────────────────
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-sandbox}
      # ── Optional: Daraja webhook secret ──────────────────────────────────────
      DARAJA_WEBHOOK_SECRET: ${DARAJA_WEBHOOK_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── React Frontend (Nginx) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: idcs_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  idcs_db:
    name: idcs_database
